[project]
name = "rag-assistant"
version = "0.1.0"
description = "Fully local retrieval-augmented generation over your own documents, with citations and evaluation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "numpy>=1.26",
]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
ui = ["streamlit>=1.36"]
dev = ["pytest>=8.0"]

[project.scripts]
rag = "rag.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
